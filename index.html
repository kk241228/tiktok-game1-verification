<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | Stay_Quiet_and_Have_Fun</title>

  <!-- TikTok&移动端完美视口 -->
  <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- 强制竖屏全屏 -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="screen-orientation" content="portrait"/>
  <meta name="x5-orientation" content="portrait">
  <meta name="x5-page-mode" content="app">

  <!-- 静态资源路径 完美对应你现有文件 -->
  <link rel="stylesheet" type="text/css" href="./style-mobile.25fc5.css"/>
  <link rel="icon" href="./favicon.8de1.ico"/>

  <!-- 修复全屏+点击坐标错位 -->
  <style>
    * { margin:0; padding:0; border:0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #ffffff;
    }
    canvas#GameCanvas {
      display: block !important;
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
    }
    #splash {
      position: absolute;
      width:100%;
      height:100%;
      top:0;
      left:0;
    }
  </style>

</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<!-- 已经改成根目录的settings.js，完全匹配你的文件 -->
<script src="./settings.js" charset="utf-8"></script>
<script src="./main.485e2.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // 引擎底层boot拦截+资源路径强制修复 根治GitHub 404
    const originalBoot = window.boot;
    window.boot = function(){
        if(window.cc && cc.assetManager){
            cc.assetManager.downloader.remoteServerRoot = "./";
            cc.assetManager.bundleRoot = "./";
        }
        originalBoot && originalBoot();
    };

    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      // 强制所有JS走相对路径
      domScript.src = "./" + moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.577e1.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.7f489.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
</body>
</html>
